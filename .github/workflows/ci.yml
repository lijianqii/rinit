# rinit CI (plan §4.1: "单元测试(每个 commit 必跑)").
#
# Three layers, cheapest first:
#   host    - fmt + clippy + the full host test suite; runs on every push/PR
#   aarch64 - cross-compiles the dynamic tool binaries
#   guest   - boots qemu with the packaged loader/libc and asserts the M0
#             acceptance list on the serial log
#
# The guest job reuses the Makefile pipeline, so what CI verifies is exactly
# what `make test-system` verifies locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Do not set RUSTFLAGS globally: it overrides per-target linker and feature
  # flags from `.cargo/config.toml`. Clippy below passes `-D warnings`
  # explicitly instead.

jobs:
  host:
    name: fmt + clippy + tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # The runners start with an empty cargo registry, and everything below
      # runs with --offline. Fetch the locked dependency set once, online, so
      # the cache and the offline commands have something to resolve against.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --offline --locked --workspace -- --nocapture

      - name: Docs build
        run: cargo doc --offline --locked --workspace --no-deps

  aarch64:
    name: cross-compile (aarch64, dynamic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and target
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-unknown-linux-gnu

      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --offline --locked --release --target aarch64-unknown-linux-gnu

      - name: Verify the own tools are dynamically linked
        # rinit/rctl/processes are dynamic by design; the image builder copies
        # the matching loader and libc into the initramfs. A static binary here
        # means the target config or the build flags regressed.
        run: |
          for bin in rinit rctl processes; do
            path="target/aarch64-unknown-linux-gnu/release/${bin}"
            test -x "$path" || { echo "missing $path"; exit 1; }
            if ! readelf -d "$path" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$bin is statically linked; expected dynamic"
              exit 1
            fi
            if ! readelf -l "$path" 2>/dev/null | grep -q 'Requesting program interpreter: /lib/ld-linux-aarch64.so.1'; then
              echo "::error::$bin has an unexpected interpreter"
              exit 1
            fi
            echo "$bin: $(du -h "$path" | cut -f1) (dynamic)"
          done

  arm32:
    name: cross-compile (armv7, dynamic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and target
        run: |
          rustup component add rustfmt clippy
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          key: arm32

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --offline --locked --release --target armv7-unknown-linux-gnueabihf

      - name: Verify the own tools are dynamically linked
        run: |
          for bin in rinit rctl processes; do
            path="target/armv7-unknown-linux-gnueabihf/release/${bin}"
            test -x "$path" || { echo "missing $path"; exit 1; }
            if ! readelf -d "$path" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$bin is statically linked; expected dynamic"
              exit 1
            fi
            if ! readelf -l "$path" 2>/dev/null | grep -q 'Requesting program interpreter: /lib/ld-linux-armhf.so.3'; then
              echo "::error::$bin has an unexpected interpreter"
              exit 1
            fi
            echo "$bin: $(du -h "$path" | cut -f1) (dynamic, armv7)"
          done

  guest:
    name: qemu system test (aarch64)
    runs-on: ubuntu-latest
    needs: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and host deps
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu qemu-system-arm bc flex bison libssl-dev \
            libelf-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Kernel config cache
        uses: actions/cache@v4
        with:
          path: build/dl
          key: kernel-${{ runner.os }}-6.6.158

      - name: Build rinit, kernel, busybox, initramfs
        run: make initramfs kernel busybox

      - name: Boot and assert
        run: make test-system

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: build/logs/*.log
          if-no-files-found: warn
