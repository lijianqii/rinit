# rinit CI (plan §4.1: "单元测试(每个 commit 必跑)").
#
# Three layers, cheapest first:
#   host    - fmt + clippy + the full host test suite; runs on every push/PR
#   aarch64 - cross-compiles the static binaries (plan §2 risk 6b)
#   guest   - boots qemu and asserts the M0 acceptance list on the serial log
#
# The guest job reuses the Makefile pipeline, so what CI verifies is exactly
# what `make test-system` verifies locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep the pinned toolchain from rust-toolchain.toml in effect.
  RUSTFLAGS: -D warnings

jobs:
  host:
    name: fmt + clippy + tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Tests
        run: cargo test --offline --workspace -- --nocapture

      - name: Docs build
        run: cargo doc --offline --workspace --no-deps

  aarch64:
    name: cross-compile (aarch64, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and target
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-unknown-linux-gnu

      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Build
        run: cargo build --offline --release --target aarch64-unknown-linux-gnu

      - name: Verify the binaries are really static
        # Plan §5 risk 6b: a dynamic build against a mismatched sysroot is a
        # black screen at boot, so assert statically at CI time.
        run: |
          for bin in rinit rinit-testservice; do
            path="target/aarch64-unknown-linux-gnu/release/${bin}"
            test -x "$path" || { echo "missing $path"; exit 1; }
            if readelf -d "$path" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$bin is dynamically linked; PID 1 must be static"
              exit 1
            fi
            echo "$bin: $(du -h "$path" | cut -f1) (static)"
          done

  guest:
    name: qemu system test (aarch64)
    runs-on: ubuntu-latest
    needs: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and host deps
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu qemu-system-arm bc flex bison libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Kernel config cache
        uses: actions/cache@v4
        with:
          path: build/dl
          key: kernel-${{ runner.os }}-6.6.158

      - name: Build rinit, kernel, busybox, initramfs
        run: make initramfs kernel busybox

      - name: Boot and assert
        run: make test-system

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: build/logs/*.log
          if-no-files-found: warn
