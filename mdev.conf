# /etc/mdev.conf for the rinit image.
#
# mdev's built-in fallback is 0660 root:root. devtmpfs gives the standard
# character devices a wider default, and programs run as non-root need /dev/null
# and friends. Keep those nodes world-readable/writable; leave the remaining
# hardware nodes at the conservative mdev default.
#
# DEVNAME  UID:GID  PERM
null       0:0      0666
zero       0:0      0666
full       0:0      0666
random     0:0      0666
urandom    0:0      0666
tty        0:0      0666
ptmx       0:0      0666
console    0:0      0600
net/tun    0:0      0666
fuse       0:0      0666
.*         0:0      0660
