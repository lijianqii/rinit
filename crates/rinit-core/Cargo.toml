[package]
name = "rinit-core"
description = "Platform-independent core engine for rinit (no_std + alloc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Intentionally empty: rinit-core depends only on `core` and `alloc`
# (plan §2 "no_std + alloc 落地方式").

[dev-dependencies]
# Property tests for the unit-name invariants (plan §4.1/§4.4). Dev-only, so
# the `no_std + alloc` production dependency set is unchanged.
proptest = "1.11"

[lints.rust]
# `deny`, not `forbid`: the library itself is `#![forbid(unsafe_code)]` in
# `src/lib.rs` and cannot opt out, but `tests/allocations.rs` must install a
# counting global allocator to check the core for leaks (plan §4.4) and so
# carries a local, documented `allow`.
unsafe_code = "deny"
