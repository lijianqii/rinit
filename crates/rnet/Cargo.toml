[package]
name = "rnet"
description = "rnet network manager and rncli control client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rnet"
path = "src/lib.rs"

[[bin]]
name = "rnetd"
path = "src/bin/rnetd.rs"

[[bin]]
name = "rncli"
path = "src/bin/rncli.rs"

[dependencies]
libc.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
