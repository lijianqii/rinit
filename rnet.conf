# Default rnet configuration for the development image.
#
# The qemu user-mode network answers DHCP on eth0. A board without a NIC keeps
# rnetd active and simply has no online interface; multi-user.target only
# Wants= network.service.

[global]
manage-resolv-conf = yes
manage-loopback = yes
wait-online = any
wait-online-timeout = 30

[interface eth0]
type = ethernet
enabled = yes
dhcp4 = yes
