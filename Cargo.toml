[workspace]
resolver = "3"
members = [
    "crates/rinit-core",
    "crates/rinit-runtime",
    "crates/rinit",
    "crates/rctl",
    "crates/processes",
]
default-members = [
    "crates/rinit-core",
    "crates/rinit-runtime",
    "crates/rinit",
    "crates/rctl",
    "crates/processes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

# Pinned to versions available in the local cargo cache so the workspace builds
# fully offline (see plan §2 risk mitigation / environment constraints).
[workspace.dependencies]
libc = "0.2.190"
# `signal` is deliberately absent: rinit's handlers write to its own
# non-blocking self-pipe (see `crates/rinit-runtime/src/signals.rs`), so tokio's
# signal driver would be an unused dependency.
tokio = { version = "1.53.3", default-features = false, features = [
    "rt",
    "time",
    "net",
    "sync",
    "io-util",
    "macros",
] }
rinit-core = { path = "crates/rinit-core" }
rinit-runtime = { path = "crates/rinit-runtime" }

# PID 1 hardening (plan §2.1⑦): panic must abort (watchdog/backstop resets the
# box), and integer overflow becomes an explicit, testable panic instead of
# silent wrapping.
[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Keep overflow checks on in dev too (default) for consistent semantics.
overflow-checks = true
