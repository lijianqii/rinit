# Cross-compilation config (plan §2 / §4.3).
#
# rinit, rctl and processes are dynamically linked. The image builder copies the
# matching loader, libc and libgcc into the initramfs/rootfs, so PID 1 can still
# run before the real rootfs is mounted. BusyBox and Dropbear stay static.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# ARMv7 hard-float, the 32-bit target the arm32 build selects. The loader and
# runtime libraries are packaged by scripts/build-initramfs.sh.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

# Host/qemu-x86_64 verification build (plan §4.2): use the musl target, which
# is statically linked by default, so the same initramfs approach works without
# bundling a host glibc of the exact version. (Setting `crt-static` on the GNU
# host target would break proc-macro dylibs.)
[target.x86_64-unknown-linux-musl]
linker = "cc"
